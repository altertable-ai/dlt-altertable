minimum_pre_commit_version: "4.4.0"
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check --fix --force-exclude
        language: unsupported
        types_or: [python, pyi]

      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format --force-exclude
        language: unsupported
        types_or: [python, pyi]

      - id: ty-check
        name: ty typecheck
        entry: uv run --locked ty check src
        language: unsupported
        files: '(\.pyi?$|^(pyproject\.toml|uv\.lock|\.pre-commit-config\.yaml)$)'
        pass_filenames: false

      - id: conventional-commit
        name: conventional commit message
        entry: uv run --locked conventional-pre-commit
        language: unsupported
        stages: [commit-msg]
